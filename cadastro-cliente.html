<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Cliente - Locadora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎬 Vídeo Locadora Passatempo</h1>
            <p>Sistema de Gerenciamento</p>
        </header>

        <nav>
            <a href="index.html">Início</a>
            <a href="cadastro-filme.html">Cadastrar Filme</a>
            <a href="cadastro-cliente.html" class="active">Cadastrar Cliente</a>
            <a href="locacao.html">Fazer Locação</a>
            <a href="devolucao.html">Devolver Item</a>
            <a href="reserva.html">Fazer Reserva</a>
            <a href="consulta.html">Consultar Acervo</a>
        </nav>

        <main>
            <h2>Cadastro de Cliente</h2>
            
            <form id="formCliente">
                <div class="form-group">
                    <label>Tipo de Cliente *</label>
                    <select id="tipoCliente" onchange="toggleCampos()">
                        <option value="titular">Titular</option>
                        <option value="dependente">Dependente</option>
                    </select>
                </div>

                <div class="two-columns">
                    <div class="form-group">
                        <label>Nome Completo *</label>
                        <input type="text" id="nome" required>
                    </div>
                    <div class="form-group">
                        <label>Email *</label>
                        <input type="email" id="email" required>
                    </div>
                </div>

                <div class="two-columns">
                    <div class="form-group">
                        <label>Data de Nascimento *</label>
                        <input type="date" id="dataNascimento" required>
                    </div>
                    <div class="form-group">
                        <label>Sexo *</label>
                        <select id="sexo" required>
                            <option value="M">Masculino</option>
                            <option value="F">Feminino</option>
                        </select>
                    </div>
                </div>

                <div id="camposTitular">
                    <div class="form-group">
                        <label>CPF *</label>
                        <input type="text" id="cpf" placeholder="000.000.000-00">
                    </div>

                    <div class="form-group">
                        <label>Endereço *</label>
                        <input type="text" id="endereco">
                    </div>

                    <div class="two-columns">
                        <div class="form-group">
                            <label>Telefone Residencial</label>
                            <input type="tel" id="telResidencial" placeholder="(00) 0000-0000">
                        </div>
                        <div class="form-group">
                            <label>Telefone Celular *</label>
                            <input type="tel" id="telCelular" placeholder="(00) 00000-0000">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Local de Trabalho</label>
                        <input type="text" id="localTrabalho">
                    </div>

                    <div class="form-group">
                        <label>Telefone Comercial</label>
                        <input type="tel" id="telComercial" placeholder="(00) 0000-0000">
                    </div>
                </div>

                <button type="submit">Cadastrar Cliente</button>
            </form>

            <div id="mensagem"></div>

            <div class="lista-itens">
                <h3>Clientes Cadastrados</h3>
                <div id="listaClientes"></div>
            </div>
        </main>

        <footer>
            <p>&copy; 2024 Vídeo Locadora Passatempo</p>
        </footer>
    </div>

    <script type="module">
        import { Titular } from './Titular.js';
        import { Dependente } from './Dependente.js';

        let clientes = JSON.parse(localStorage.getItem('clientes') || '[]');
        let contadorId = parseInt(localStorage.getItem('contadorId') || '1');

        window.toggleCampos = function() {
            const tipo = document.getElementById('tipoCliente').value;
            const camposTitular = document.getElementById('camposTitular');
            camposTitular.style.display = tipo === 'titular' ? 'block' : 'none';
        };

        function exibirClientes() {
            const container = document.getElementById('listaClientes');
            if (clientes.length === 0) {
                container.innerHTML = '<p style="color: #666;">Nenhum cliente cadastrado ainda.</p>';
                return;
            }

            container.innerHTML = clientes.map(c => `
                <div class="item">
                    <h4>${c.nome}</h4>
                    <p><strong>Email:</strong> ${c.email}</p>
                    <p><strong>Data Nascimento:</strong> ${new Date(c.dataNascimento).toLocaleDateString()}</p>
                    ${c.cpf ? `<p><strong>CPF:</strong> ${c.cpf}</p>` : ''}
                    ${c.cpf ? '<span class="badge badge-success">Titular</span>' : '<span class="badge badge-warning">Dependente</span>'}
                </div>
            `).join('');
        }

        document.getElementById('formCliente').addEventListener('submit', (e) => {
            e.preventDefault();

            const tipo = document.getElementById('tipoCliente').value;
            const dados = {
                idCliente: contadorId++,
                nome: document.getElementById('nome').value,
                email: document.getElementById('email').value,
                dataNascimento: document.getElementById('dataNascimento').value,
                sexo: document.getElementById('sexo').value
            };

            try {
                let cliente;
                
                if (tipo === 'titular') {
                    cliente = new Titular(
                        dados.idCliente,
                        dados.nome,
                        dados.email,
                        dados.dataNascimento,
                        dados.sexo,
                        document.getElementById('endereco').value,
                        document.getElementById('telResidencial').value,
                        document.getElementById('localTrabalho').value,
                        document.getElementById('telComercial').value,
                        document.getElementById('telCelular').value,
                        document.getElementById('cpf').value
                    );
                } else {
                    cliente = new Dependente(
                        dados.idCliente,
                        dados.nome,
                        dados.email,
                        dados.dataNascimento,
                        dados.sexo
                    );
                }

                clientes.push(cliente);
                localStorage.setItem('clientes', JSON.stringify(clientes));
                localStorage.setItem('contadorId', contadorId.toString());

                document.getElementById('mensagem').innerHTML = '<div class="alert alert-success">✅ Cliente cadastrado com sucesso!</div>';
                e.target.reset();
                exibirClientes();

                setTimeout(() => {
                    document.getElementById('mensagem').innerHTML = '';
                }, 3000);

            } catch (error) {
                document.getElementById('mensagem').innerHTML = `<div class="alert alert-error">❌ Erro: ${error.message}</div>`;
            }
        });

        exibirClientes();
    </script>
</body>
</html>
