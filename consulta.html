<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultar Acervo - Locadora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎬 Vídeo Locadora Passatempo</h1>
            <p>Sistema de Gerenciamento</p>
        </header>

        <nav>
            <a href="index.html">Início</a>
            <a href="cadastro-filme.html">Cadastrar Filme</a>
            <a href="cadastro-cliente.html">Cadastrar Cliente</a>
            <a href="locacao.html">Fazer Locação</a>
            <a href="devolucao.html">Devolver Item</a>
            <a href="reserva.html">Fazer Reserva</a>
            <a href="consulta.html" class="active">Consultar Acervo</a>
        </nav>

        <main>
            <h2>Consulta ao Acervo</h2>

            <div class="form-group">
                <label>🔍 Buscar por Título</label>
                <input type="text" id="buscaTitulo" placeholder="Digite parte do título original ou em português...">
            </div>

            <div class="two-columns">
                <div class="form-group">
                    <label>Filtrar por Gênero</label>
                    <select id="filtroGenero">
                        <option value="">Todos os gêneros</option>
                        <option value="acao">Ação</option>
                        <option value="animacao">Animação</option>
                        <option value="aventura">Aventura</option>
                        <option value="comedia">Comédia</option>
                        <option value="documentario">Documentário</option>
                        <option value="drama">Drama</option>
                        <option value="ficcao">Ficção</option>
                        <option value="guerra">Guerra</option>
                        <option value="musical">Musical</option>
                        <option value="policial">Policial</option>
                        <option value="romance">Romance</option>
                        <option value="suspense">Suspense</option>
                        <option value="terror">Terror</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Filtrar por Tipo de Mídia</label>
                    <select id="filtroMidia">
                        <option value="">Todas as mídias</option>
                        <option value="DVD">DVD</option>
                        <option value="Blu-Ray">Blu-Ray</option>
                        <option value="VHS">VHS</option>
                        <option value="HD-DVD">HD-DVD</option>
                    </select>
                </div>
            </div>

            <div class="two-columns">
                <div class="form-group">
                    <label>Buscar por Ator</label>
                    <input type="text" id="buscaAtor" placeholder="Nome do ator...">
                </div>

                <div class="form-group">
                    <label>Buscar por Diretor</label>
                    <input type="text" id="buscaDiretor" placeholder="Nome do diretor...">
                </div>
            </div>

            <div class="form-group">
                <label>Buscar por País</label>
                <input type="text" id="buscaPais" placeholder="País de origem...">
            </div>

            <div class="form-group">
                <label style="display: flex; align-items: center;">
                    <input type="checkbox" id="filtroLancamento" style="width: auto; margin-right: 10px;">
                    Apenas Lançamentos
                </label>
            </div>

            <button onclick="buscarFilmes()">🔍 Buscar</button>
            <button onclick="limparFiltros()" class="btn-secondary" style="background: #6c757d; margin-left: 10px;">Limpar Filtros</button>

            <div class="lista-itens">
                <h3>Resultados da Busca</h3>
                <div id="resultados"></div>
            </div>
        </main>

        <footer>
            <p>&copy; 2024 Vídeo Locadora Passatempo</p>
        </footer>
    </div>

    <script>
        let filmes = JSON.parse(localStorage.getItem('filmes') || '[]');

        function buscarFilmes() {
            const titulo = document.getElementById('buscaTitulo').value.toLowerCase();
            const genero = document.getElementById('filtroGenero').value;
            const tipoMidia = document.getElementById('filtroMidia').value;
            const ator = document.getElementById('buscaAtor').value.toLowerCase();
            const diretor = document.getElementById('buscaDiretor').value.toLowerCase();
            const pais = document.getElementById('buscaPais').value.toLowerCase();
            const apenasLancamento = document.getElementById('filtroLancamento').checked;

            let resultados = filmes.filter(f => {
                // Filtro por título
                if (titulo && !f.tituloOriginal.toLowerCase().includes(titulo) && 
                    !f.tituloPortugues.toLowerCase().includes(titulo)) {
                    return false;
                }

                // Filtro por gênero
                if (genero && f.genero !== genero) {
                    return false;
                }

                // Filtro por tipo de mídia (verificar se tem itens disponíveis desse tipo)
                if (tipoMidia) {
                    const temMidia = f.itens.some(i => i.tipoMidia === tipoMidia && i.status === 'disponivel');
                    if (!temMidia) return false;
                }

                // Filtro por ator
                if (ator && !f.elenco.toLowerCase().includes(ator)) {
                    return false;
                }

                // Filtro por diretor
                if (diretor && !f.direcao.toLowerCase().includes(diretor)) {
                    return false;
                }

                // Filtro por país
                if (pais && !f.pais.toLowerCase().includes(pais)) {
                    return false;
                }

                // Filtro por lançamento
                if (apenasLancamento && !f.ehLancamento) {
                    return false;
                }

                return true;
            });

            exibirResultados(resultados);
        }

        function exibirResultados(resultados) {
            const container = document.getElementById('resultados');

            if (resultados.length === 0) {
                container.innerHTML = '<p style="color: #666;">Nenhum filme encontrado com os critérios informados.</p>';
                return;
            }

            container.innerHTML = resultados.map(f => {
                const itensDisponiveis = f.itens.filter(i => i.status === 'disponivel');
                const tiposDisponiveis = [...new Set(itensDisponiveis.map(i => i.tipoMidia))];

                return `
                    <div class="item">
                        <h4>${f.tituloPortugues} (${f.ano})</h4>
                        <p><strong>Título Original:</strong> ${f.tituloOriginal}</p>
                        <p><strong>Direção:</strong> ${f.direcao}</p>
                        <p><strong>Elenco:</strong> ${f.elenco}</p>
                        <p><strong>Gênero:</strong> ${f.genero} | <strong>País:</strong> ${f.pais}</p>
                        <p><strong>Duração:</strong> ${f.duracao} minutos</p>
                        <p><strong>Sinopse:</strong> ${f.sinopse}</p>
                        <p><strong>Mídias disponíveis:</strong> ${tiposDisponiveis.length > 0 ? tiposDisponiveis.join(', ') : 'Nenhuma'}</p>
                        ${f.ehLancamento ? '<span class="badge badge-warning">Lançamento</span>' : '<span class="badge badge-success">Catálogo</span>'}
                        ${itensDisponiveis.length > 0 ? 
                            `<span class="badge badge-success">${itensDisponiveis.length} disponível(is)</span>` : 
                            '<span class="badge badge-danger">Indisponível</span>'
                        }
                    </div>
                `;
            }).join('');
        }

        function limparFiltros() {
            document.getElementById('buscaTitulo').value = '';
            document.getElementById('filtroGenero').value = '';
            document.getElementById('filtroMidia').value = '';
            document.getElementById('buscaAtor').value = '';
            document.getElementById('buscaDiretor').value = '';
            document.getElementById('buscaPais').value = '';
            document.getElementById('filtroLancamento').checked = false;
            document.getElementById('resultados').innerHTML = '<p style="color: #666;">Use os filtros acima para buscar filmes no acervo.</p>';
        }

        window.buscarFilmes = buscarFilmes;
        window.limparFiltros = limparFiltros;

        // Exibir todos os filmes inicialmente
        if (filmes.length > 0) {
            exibirResultados(filmes);
        } else {
            document.getElementById('resultados').innerHTML = '<p style="color: #666;">Nenhum filme cadastrado ainda. <a href="cadastro-filme.html">Cadastre o primeiro filme!</a></p>';
        }
    </script>
</body>
</html>
